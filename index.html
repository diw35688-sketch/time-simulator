<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间模拟器</title>
<style>
  :root { --bg: #040605; --hud: rgba(215,255,225,.8); --warn: #ffcf6b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: system-ui, "Microsoft YaHei", sans-serif; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: brightness(.6) saturate(.7) contrast(1.05); }
  #obj { position: fixed; pointer-events: none; transform-origin: 50% 60%; }
  #objFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; pointer-events: none; }
  #gl, #skel { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #hud { position: fixed; top: 12px; right: 14px; color: var(--hud); font: 12px/1.6 ui-monospace, Consolas, monospace; text-align: right; pointer-events: none; text-shadow: 0 0 6px #000; }
  #banner { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; background: rgba(40,28,0,.85); color: var(--warn); font-size: 14px; display: none; }
  #tip { position: fixed; bottom: 18px; left: 16px; right: 16px; text-align: center; color: var(--hud); font-size: 14px; pointer-events: none; text-shadow: 0 0 8px #000; transition: opacity .6s; }
  #camSel { position: fixed; left: 12px; bottom: 12px; max-width: 46vw; background: rgba(0,0,0,.6); color: var(--hud); border: 1px solid rgba(120,255,170,.35); border-radius: 6px; padding: 4px 6px; font-size: 12px; z-index: 5; }
  #caption { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; color: #e6fff0; font: 600 30px "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: .08em;
    text-shadow: 0 0 14px #1dff5e, 0 0 3px #000; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
  #caption.show { opacity: 1; transform: none; }
  #sound { position: fixed; right: 14px; bottom: 12px; color: var(--hud); font-size: 12px; pointer-events: none; text-shadow: 0 0 6px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js"
} }
</script>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="gl"></canvas>
<canvas id="skel"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<select id="camSel" hidden></select>
<div id="sound">点击任意处开启声音</div>
<div id="caption"></div>
<div id="tip">张开手掌召唤法阵 · 法阵靠近物品会锁定 · 转动手腕拨时间，转多少走多少 · 握拳松开拨盘，转回来再张开接着拨 · D 键显示手部骨架（无摄像头：鼠标 + 滚轮）</div>

<script type="module" src="js/main.js"></script>
<script type="module" src="studio.js"></script>
</body>
</html>
