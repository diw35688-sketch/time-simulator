<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间模拟器</title>
<style>
  :root { --bg: #040605; --hud: rgba(215,255,225,.8); --warn: #ffcf6b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: system-ui, "Microsoft YaHei", sans-serif; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: brightness(.6) saturate(.7) contrast(1.05); }
  #obj { position: fixed; pointer-events: none; transform-origin: 50% 60%; }
  #objFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; pointer-events: none; }
  #gl, #skel { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #hud { position: fixed; top: 12px; right: 14px; color: var(--hud); font: 12px/1.6 ui-monospace, Consolas, monospace; text-align: right; pointer-events: none; text-shadow: 0 0 6px #000; }
  #banner { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; background: rgba(40,28,0,.85); color: var(--warn); font-size: 14px; display: none; }
  #tip { position: fixed; bottom: 18px; left: 16px; right: 16px; text-align: center; color: var(--hud); font-size: 14px; pointer-events: none; text-shadow: 0 0 8px #000; transition: opacity .6s; }
  #camSel { position: fixed; left: 12px; bottom: 12px; max-width: 46vw; background: rgba(0,0,0,.6); color: var(--hud); border: 1px solid rgba(120,255,170,.35); border-radius: 6px; padding: 4px 6px; font-size: 12px; z-index: 5; }
  #sound { position: fixed; right: 14px; bottom: 12px; color: var(--hud); font-size: 12px; pointer-events: none; text-shadow: 0 0 6px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js"
} }
</script>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="gl"></canvas>
<canvas id="skel"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<select id="camSel" hidden></select>
<div id="sound">点击任意处开启声音</div>
<div id="tip">张开手掌召唤法阵 · 法阵对准物体后转动手腕拨动时间 · 握拳冻结 · D 键显示/隐藏手部骨架　（无摄像头：鼠标 + 滚轮）</div>

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const OBJECT_URL = params.get('object');
const USE_CAM = params.get('nocam') === null;
const GLOW = '#1dff5e', CORE = '#dcffe6';
const banner = msg => { const b = document.getElementById('banner'); b.textContent = msg; b.style.display = msg ? 'block' : 'none'; };

if (location.protocol === 'file:') banner('当前是双击打开的文件，浏览器不允许调用摄像头。请双击 start.bat，或打开 http://127.0.0.1:8765/');

// ---------- 时间状态 ----------
const time = { t: 0, vel: 0, locked: false };
let objFrame = null, stages = null;
function pushTime() { objFrame?.contentWindow?.postMessage({ type: 'timespell:setTime', t: time.t }, '*'); }

// ---------- 物体层：每个物品是一个独立页面，嵌入模式下透明叠在摄像头画面上 ----------
function objectRect() {
  const s = Math.min(innerWidth, innerHeight) * 0.35;
  return { cx: innerWidth * 0.5, cy: innerHeight * 0.6, size: s };
}
// 物品都是 AI 生成或别人贡献的代码，一律放进不带 allow-same-origin 的沙箱：拿不到本页的存储，读不到 API Key
function setObject(o) {
  objFrame?.remove();
  stages = null;
  objFrame = document.createElement('iframe');
  objFrame.id = 'objFrame';
  objFrame.sandbox = 'allow-scripts';
  objFrame.src = o.src + (o.src.includes('?') ? '&' : '?') + 'embed=1';
  document.body.insertBefore(objFrame, document.getElementById('gl'));
  objFrame.addEventListener('load', pushTime);
}
addEventListener('message', e => {
  if (e.data?.type === 'timespell:stages' && e.source === objFrame?.contentWindow && Array.isArray(e.data.stages)) stages = e.data.stages.slice(0, 12);
});
const stageName = t => {
  if (!stages?.length) return '';
  const s = [...stages].sort((a, b) => Math.abs(a.t - t) - Math.abs(b.t - t))[0];
  return String(s?.name ?? '').slice(0, 16);
};
window.timespell = { setObject, getTime: () => time.t, stage: () => stageName(time.t) };
if (OBJECT_URL) setObject({ src: OBJECT_URL });
else if (!document.querySelector('script[src="studio.js"]')) setObject({ src: 'objects/apple3d.html' });

// ---------- three.js：透视相机，z=0 平面上 1 单位 = 1 CSS 像素 ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 20000);
const dbg = document.getElementById('skel'), dctx = dbg.getContext('2d');
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.position.set(0, 0, (innerHeight / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.updateProjectionMatrix();
  dbg.width = innerWidth; dbg.height = innerHeight;
}
addEventListener('resize', resize); resize();

// ---------- 纹理绘制：每层先画绿色光晕，再画浅色线芯 ----------
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function paint(c, draw, unit) {
  const g = c.getContext('2d');
  g.lineCap = g.lineJoin = 'round';
  for (const pass of ['glow', 'core']) {
    g.save();
    unit(g);
    g.strokeStyle = g.fillStyle = pass === 'glow' ? GLOW : CORE;
    g.shadowColor = GLOW;
    g.shadowBlur = pass === 'glow' ? c.width * .018 : c.width * .005;
    g.globalAlpha = pass === 'glow' ? .55 : 1;
    g.lineWidth = pass === 'glow' ? 0.016 : 0.0055;
    draw(g, pass);
    g.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function discTexture(draw, size = 1536) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  return paint(c, draw, g => { g.translate(size / 2, size / 2); g.scale(size / 2, size / 2); });
}
const circle = (g, r) => { g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke(); };
function square(g, r, rot) {
  g.beginPath();
  for (let i = 0; i <= 4; i++) { const a = rot + Math.PI / 4 + i * Math.PI / 2; i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  g.stroke();
}
function glyph(g, x, y, s, rand) {
  const pts = []; for (let i = 0; i < 9; i++) pts.push([(i % 3 - 1) * s, (Math.floor(i / 3) - 1) * s * 1.3]);
  g.beginPath();
  let p = pts[Math.floor(rand() * 9)]; g.moveTo(x + p[0], y + p[1]);
  for (let k = 2 + Math.floor(rand() * 3); k >= 0; k--) { p = pts[Math.floor(rand() * 9)]; g.lineTo(x + p[0], y + p[1]); }
  g.stroke();
  if (rand() < .3) { g.beginPath(); g.arc(x, y - s * 1.7, s * .22, 0, Math.PI * 2); g.stroke(); }
}
function glyphBand(g, r0, r1, n, seed) {
  circle(g, r0); circle(g, r1);
  const rand = rng(seed), s = (r1 - r0) * .26, rm = (r0 + r1) / 2;
  for (let i = 0; i < n; i++) {
    g.save(); g.rotate(i / n * Math.PI * 2); glyph(g, 0, -rm, s, rand); g.restore();
  }
}

// 主盘：外圈符文带 / 双方形八角星 / 内圈符文带 / 内星与圆心 / 半透明玻璃底
const DISC_LAYERS = [
  { spin: .25, timeSpin: 2.0, tex: discTexture(g => { glyphBand(g, .9, .985, 54, 11); }) },
  { spin: -.18, timeSpin: -3.0, tex: discTexture(g => { circle(g, .86); square(g, .86, 0); square(g, .86, Math.PI / 4); }) },
  { spin: .4, timeSpin: 4.0, tex: discTexture(g => { glyphBand(g, .56, .64, 30, 23); }) },
  { spin: -.6, timeSpin: -5.5, tex: discTexture(g => {
      square(g, .52, 0); square(g, .52, Math.PI / 4); circle(g, .22); circle(g, .15);
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; g.beginPath(); g.moveTo(Math.cos(a) * .15, Math.sin(a) * .15); g.lineTo(Math.cos(a) * .22, Math.sin(a) * .22); g.stroke(); }
    }) },
];
const FILL_TEX = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  const gr = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  gr.addColorStop(0, 'rgba(40,255,110,.28)'); gr.addColorStop(.55, 'rgba(30,255,95,.14)');
  gr.addColorStop(.96, 'rgba(30,255,95,.2)'); gr.addColorStop(1, 'rgba(30,255,95,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

// 前臂符文环：圆柱侧面贴图，上下边线 + 符文 + 链状交叉纹
function bandTexture(seed, lattice) {
  const W = 2048, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
  return paint(c, (g) => {
    const rand = rng(seed);
    g.beginPath(); g.moveTo(0, .1); g.lineTo(W / H, .1); g.moveTo(0, .9); g.lineTo(W / H, .9); g.stroke();
    if (lattice) {
      g.beginPath();
      const n = 28, w = (W / H) / n;
      for (let i = 0; i < n; i++) { g.moveTo(i * w, .2); g.lineTo((i + 1) * w, .8); g.moveTo(i * w, .8); g.lineTo((i + 1) * w, .2); }
      g.stroke();
    } else {
      const n = 26, w = (W / H) / n;
      for (let i = 0; i < n; i++) glyph(g, (i + .5) * w, .52, .1, rand);
    }
  }, g => g.scale(H, H));
}
const BAND_TEX = [bandTexture(5, false), bandTexture(9, true), bandTexture(13, false)];

const additive = (map, extra = {}) => new THREE.MeshBasicMaterial({ map, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, ...extra });
// 整个生命周期（t 从 -1 到 +1）需要手腕转的角度，?deg= 可调
const LIFE_DEG = THREE.MathUtils.clamp(+(params.get('deg') || 150), 30, 720), LIFE_RAD = THREE.MathUtils.degToRad(LIFE_DEG);
// 弧角从法阵正上方（手指方向）起算，顺时针为正
const arcGeo = (a0, a1, r0 = 1.03, r1 = 1.07) => new THREE.RingGeometry(r0, r1, 64, 1, Math.PI / 2 - Math.max(a0, a1), Math.max(Math.abs(a1 - a0), 1e-4));

function makeRig() {
  const root = new THREE.Group();
  const disc = new THREE.Group();
  const fill = new THREE.Mesh(new THREE.CircleGeometry(1, 96), additive(FILL_TEX));
  disc.add(fill);
  const layers = DISC_LAYERS.map(L => { const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), additive(L.tex)); m.userData = L; disc.add(m); return m; });
  root.add(disc);
  // 生命周期刻度弧：底轨 = 整段可拨范围，亮弧 = 已拨过的部分（转多少度就亮多少度）
  const track = new THREE.Mesh(arcGeo(-LIFE_RAD / 2, LIFE_RAD / 2, 1.035, 1.05), new THREE.MeshBasicMaterial({ color: GLOW, transparent: true, opacity: .25, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  const arc = new THREE.Mesh(arcGeo(0, 0), new THREE.MeshBasicMaterial({ color: CORE, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  disc.add(track, arc);
  const rings = [[.3, .5, 0], [.62, .55, 1], [.95, .6, 2]].map(([along, rad, ti]) => {
    const geo = new THREE.CylinderGeometry(1, 1, .16, 96, 1, true);
    const m = new THREE.Mesh(geo, additive(BAND_TEX[ti]));
    m.userData = { along, rad, spin: ti % 2 ? -1.2 : .9, angle: 0 };
    root.add(m); return m;
  });
  scene.add(root);
  return {
    root, disc, fill, layers, rings, track, arc, arcT: 0,
    pos: new THREE.Vector3(), quat: new THREE.Quaternion(), armDir: new THREE.Vector3(0, -1, 0), wrist: new THREE.Vector3(), armLen: 0, armOk: false,
    radius: 120, handLen: 80, presence: 0, want: 0, spin: 0, locked: false,
  };
}
const rigs = [makeRig(), makeRig()];

// ---------- 火花粒子（三维，落在法阵平面上沿切向飞出） ----------
const MAXP = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAXP * 3), pAlpha = new Float32Array(MAXP), pVel = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('alpha', new THREE.BufferAttribute(pAlpha, 1));
const pMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(CORE).lerp(new THREE.Color(GLOW), .4) }, px: { value: renderer.getPixelRatio() } },
  vertexShader: `attribute float alpha; varying float vA; uniform float px;
    void main(){ vA = alpha; gl_PointSize = (1.5 + 3.5 * alpha) * px; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 color; varying float vA;
    void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(color, vA * smoothstep(.5, 0., d)); }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(pGeo, pMat));
let pNext = 0;
const _ax = new THREE.Vector3(), _ay = new THREE.Vector3();
function spawn(r, n) {
  _ax.set(1, 0, 0).applyQuaternion(r.quat); _ay.set(0, 1, 0).applyQuaternion(r.quat);
  const dir = Math.sign(r.spin) || 1;
  for (let k = 0; k < n; k++) {
    const i = pNext = (pNext + 1) % MAXP, a = Math.random() * Math.PI * 2, rr = r.radius * (.86 + Math.random() * .14);
    const ca = Math.cos(a), sa = Math.sin(a), sp = 30 + Math.random() * 110 + Math.abs(r.spin) * 140;
    for (let j = 0; j < 3; j++) {
      const ex = [_ax.x, _ax.y, _ax.z][j], ey = [_ay.x, _ay.y, _ay.z][j];
      pPos[i * 3 + j] = [r.pos.x, r.pos.y, r.pos.z][j] + (ex * ca + ey * sa) * rr;
      pVel[i * 3 + j] = (-ex * sa + ey * ca) * sp * dir + (ex * ca + ey * sa) * 25;
    }
    pLife[i] = .4 + Math.random() * .8;
  }
}
function stepParticles(dt) {
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) { pAlpha[i] = 0; continue; }
    pLife[i] -= dt;
    for (let j = 0; j < 3; j++) { pPos[i * 3 + j] += pVel[i * 3 + j] * dt; pVel[i * 3 + j] *= .95; }
    pAlpha[i] = Math.max(pLife[i], 0) * 1.3;
  }
  pGeo.attributes.position.needsUpdate = pGeo.attributes.alpha.needsUpdate = true;
}

// ---------- One Euro 滤波 ----------
class OneEuro {
  constructor(minCutoff = 1.2, beta = 0.02, dCutoff = 1) { Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0 }); }
  a(cut, dt) { const r = 2 * Math.PI * cut * dt; return r / (r + 1); }
  filter(v, dt) {
    if (this.x === null) { this.x = v; return v; }
    this.dx += this.a(this.dCutoff, dt) * ((v - this.x) / dt - this.dx);
    this.x += this.a(this.minCutoff + this.beta * Math.abs(this.dx), dt) * (v - this.x);
    return this.x;
  }
  reset() { this.x = null; this.dx = 0; }
}

// ---------- 输入 ----------
const hands = [0, 1].map(() => ({
  seen: false, open: false, P: null, fx: new OneEuro(), fy: new OneEuro(), fl: new OneEuro(.8, .005),
  n: new THREE.Vector3(0, 0, 1), up: new THREE.Vector3(0, 1, 0), arm: new THREE.Vector3(0, -1, 0), angle: null, acc: 0, prevF: undefined,
}));
let handStatus = USE_CAM ? '启动中' : '已关闭', camOk = false, showDbg = true;
const mouse = { x: innerWidth / 2, y: innerHeight * .4, inside: false, wheel: 0, last: -1e9 };
addEventListener('pointermove', e => { Object.assign(mouse, { x: e.clientX, y: e.clientY, inside: true, last: performance.now() }); });
document.addEventListener('pointerleave', () => { mouse.inside = false; });
addEventListener('wheel', e => { mouse.wheel += e.deltaY; mouse.last = performance.now(); e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') showDbg = !showDbg; });

const video = document.getElementById('cam');
let landmarker = null, camLabel = '';
const VIRTUAL_CAM = /todesk|virtual|obs|droidcam|screen|manycam|xsplit|nvidia broadcast|向日葵|sunlogin/i;
const camSelect = document.getElementById('camSel');
async function openCamera(deviceId) {
  video.srcObject?.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, ...(deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' }) } });
  video.srcObject = stream;
  await video.play();
  camLabel = stream.getVideoTracks()[0]?.label || '';
  return stream.getVideoTracks()[0]?.getSettings().deviceId;
}
// 远程桌面类软件（ToDesk 等）会注册虚拟摄像头，浏览器可能默认选中它：自动换成真实摄像头，并提供下拉框手选
async function pickCamera() {
  let saved = null; try { saved = localStorage.getItem('timespell.cam'); } catch {}
  let current = await openCamera(saved || undefined).catch(() => openCamera());
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  if (!saved && VIRTUAL_CAM.test(camLabel)) {
    const real = cams.find(d => !VIRTUAL_CAM.test(d.label));
    if (real) current = await openCamera(real.deviceId);
  }
  camSelect.innerHTML = cams.map((d, i) => `<option value="${d.deviceId}">${(d.label || '摄像头 ' + (i + 1)).replace(/</g, '&lt;')}</option>`).join('');
  camSelect.value = current;
  camSelect.hidden = cams.length < 2;
  camSelect.onchange = async () => {
    try { localStorage.setItem('timespell.cam', camSelect.value); } catch {}
    try { await openCamera(camSelect.value); banner(''); } catch (e) { banner(`切换摄像头失败：${e.name}，可能被其他程序占用`); }
  };
  if (VIRTUAL_CAM.test(camLabel)) banner(`当前是虚拟摄像头「${camLabel}」，画面可能是黑的。请在左下角换成真实摄像头，或在 ToDesk 设置里关闭虚拟摄像头。`);
}
async function startCamera() {
  // 摄像头和模型分开启动：模型失败也能看到画面
  try {
    handStatus = '请求摄像头';
    await pickCamera();
    camOk = true;
  } catch (err) {
    const why = { NotAllowedError: '摄像头权限被拒绝，请点地址栏左侧的图标允许摄像头后刷新',
      NotReadableError: '摄像头被其他程序占用（ToDesk、微信视频、会议软件等），关掉后刷新',
      NotFoundError: '没有检测到摄像头' }[err.name] || `摄像头启动失败：${err.name} ${err.message}`;
    banner(why + '。当前可用鼠标 + 滚轮体验。');
    handStatus = '摄像头不可用'; video.style.display = 'none';
    return;
  }
  try {
    handStatus = '加载手势模型';
    // 优先用本地 vendor（python download_models.py 下载），没有再走 CDN
    const local = (await fetch('vendor/mediapipe/hand_landmarker.task', { method: 'HEAD' }).catch(() => null))?.ok;
    const base = local ? new URL('vendor/mediapipe/', location.href).href : 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/';
    const model = local ? base + 'hand_landmarker.task' : 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    handStatus = local ? '加载本地模型' : '从 CDN 加载模型';
    if (!local) setTimeout(() => { if (!landmarker) banner('手势模型从 CDN 加载很慢（国内常见）。请运行 python download_models.py 下载到本地后刷新；现在可先用鼠标 + 滚轮。'); }, 15000);
    const { FilesetResolver, HandLandmarker, PoseLandmarker } = await import(base + 'vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks(base + 'wasm');
    const opts = delegate => ({
      baseOptions: { modelAssetPath: model, delegate },
      runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); handStatus = '就绪 GPU'; }
    catch (e) { console.warn('GPU 失败，改用 CPU', e); landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); handStatus = '就绪 CPU'; }
    // 手臂：有本地姿态模型就追踪手肘，没有就按手的方向估算前臂
    if (local && (await fetch(base + 'pose_landmarker_lite.task', { method: 'HEAD' }).catch(() => null))?.ok) {
      try {
        poser = await PoseLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: base + 'pose_landmarker_lite.task', delegate: 'GPU' }, runningMode: 'VIDEO', numPoses: 1 });
        handStatus += ' + 手臂';
      } catch (e) { console.warn('姿态模型加载失败，前臂改为估算', e); }
    }
  } catch (err) {
    console.error(err);
    banner(`手势模型加载失败（${err.message || err}）。请先运行 python download_models.py 把模型下载到本地。`);

if (USE_CAM && location.protocol !== 'file:') startCamera(); else video.style.display = 'none';

// 视频归一化坐标 → 屏幕像素（object-fit: cover + 镜像），z 按显示宽度换算成像素
function videoScale() {
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9, sa = innerWidth / innerHeight, va = vw / vh;

}
let lastVideoTime = -1, frameNo = 0;

// 手腕附近的那条姿态手臂（手肘看得见才算）

}
function readHands(now, dt) {

  const [w, h] = videoScale();
  // 按左右手固定绑定法阵，双手进出画面时不会互换。

    const len = P[0].distanceTo(P[9]);
    const open = [8, 12, 16, 20].reduce((s, i) => s + P[i].distanceTo(P[0]), 0) / 4 / len;
    H.open = H.open ? open > 1.25 : open > 1.55;

    H.palm = new THREE.Vector3(H.fx.filter(palm.x, dt), H.fy.filter(palm.y, dt), 0);

const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

function drawDebug() {
  dctx.clearRect(0, 0, dbg.width, dbg.height);
  if (!showDbg) return;
  const bones = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// ---------- 主循环 ----------
const clock = new THREE.Clock();
let fps = 60, frames = 0, fpsT = 0;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _x = new THREE.Vector3(), _y = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0);
const MOUSE_N = new THREE.Vector3(0, Math.sin(.45), Math.cos(.45)), MOUSE_ARM = new THREE.Vector3(.35, -1, 0).normalize();
const _spinQ = new THREE.Quaternion();

// ---------- 声音：背景乐 + 实时合成音效。浏览器要求先有一次点击/按键 ----------
// 仓库不带背景乐（版权原因）。把自己的音乐放到下面的路径就会自动用上；没有的话用原创的合成氛围音
const BGM_FILES = ['assets/audio/bgm_a.mp3', 'assets/audio/bgm_b.mp3'];
const audio = { ctx: null, on: false, muted: false, tracks: null, track: 0, tickAcc: 0 };
const soundEl = document.getElementById('sound');
function noiseBuffer(ctx, sec) {
  const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
// 合成氛围音：D 小调铺底（成对微失谐），低通缓慢扫频，加一路回声
function buildPad(ctx, out) {
  const g = ctx.createGain(); g.gain.value = 0;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = .8;
  const lfo = ctx.createOscillator(); lfo.frequency.value = .04;
  const depth = ctx.createGain(); depth.gain.value = 400; lfo.connect(depth).connect(lp.frequency); lfo.start();
  [73.42, 110, 146.83, 174.61, 220, 293.66].forEach((f, i) => [-7, 7].forEach(cents => {
    const o = ctx.createOscillator(); o.type = i < 3 ? 'sawtooth' : 'triangle';
    o.frequency.value = f; o.detune.value = cents;
    const v = ctx.createGain(); v.gain.value = .035 / (1 + i * .4);

}
function trackName() { const s = audio.tracks?.[audio.track]; return !s ? '' : s === 'pad' ? '合成氛围' : '曲目 ' + (audio.track + 1); }
function soundText() { return audio.muted ? '已静音 · M 恢复' : `声音开 · ${trackName()} · M 静音 · B 换背景乐`; }
function playTrack() {
  const src = audio.tracks[audio.track], now = audio.ctx.currentTime;
  audio.pad.gain.setTargetAtTime(src === 'pad' ? .55 : 0, now, src === 'pad' ? 1.5 : .2);

}
function initAudio() {

  // AudioContext 必须在点击/按键的同步阶段创建，否则浏览器不让出声
  const ctx = audio.ctx = new AudioContext();
  const master = audio.master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  // 背景乐过低通：法阵出现时变亮，锁定物体时完全打开
  audio.bgmLP = ctx.createBiquadFilter(); audio.bgmLP.type = 'lowpass'; audio.bgmLP.frequency.value = 900;

  Promise.all(BGM_FILES.map(u => fetch(u, { method: 'HEAD' }).then(r => r.ok, () => false))).then(ok => {

}
function sfxSummon() {
  const ctx = audio.ctx, t0 = ctx.currentTime;
  const n = ctx.createBufferSource(); n.buffer = audio.noise;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;

function sfxTick(forward) {
  const ctx = audio.ctx, t0 = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = forward ? 2400 : 1500;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 800;

function updateAudio(dt, tSpeed, prevT) {

  if ((e.key === 'b' || e.key === 'B') && audio.tracks) { audio.track = (audio.track + 1) % audio.tracks.length; playTrack(); }

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  frames++; fpsT += dt; if (fpsT >= .5) { fps = frames / fpsT; frames = 0; fpsT = 0; }

  readHands(now, dt);
  const anyHand = hands.some(H => H.seen);
  const useMouse = !anyHand && (!camOk || !landmarker || now - mouse.last < 3000) && (mouse.inside || now - mouse.last < 3000);
  const obj = objectRect(), objW = new THREE.Vector3(obj.cx - innerWidth / 2, innerHeight / 2 - obj.cy, 0);
  let driveT = 0;

  rigs.forEach((r, k) => {
    const H = hands[k];
    let n, up;
    if (H.seen) {
      r.pos.copy(H.palm); r.handLen = H.len;
      r.radius = THREE.MathUtils.clamp(H.len * 1.55, 60, Math.min(innerWidth, innerHeight) * .45);
      n = H.n; up = H.up;
      r.wrist.copy(H.wrist); r.armDir.copy(H.arm); r.armLen = H.armLen; r.armOk = H.armOk;
      r.want = H.open ? 1 : 0;
      if (H.angle === null) { H.angle = H.rawAngle; H.acc = 0; H.prevF = 0; }
      H.acc += angDiff(H.rawAngle, H.angle); H.angle = H.rawAngle;

      if (Math.abs(d) < .003) d = 0;                             // 静止时的识别抖动不算转动
      if (H.open && r.locked) driveT += d / LIFE_RAD * 2;
      if (!H.open) time.vel = 0;                                 // 握拳冻结；再张开从当前角度接着拨
    } else if (k === 0 && useMouse) {

      r.radius = Math.min(innerWidth, innerHeight) * .2; r.handLen = r.radius / 1.55;
      n = MOUSE_N; up = Y;
      r.armDir.copy(MOUSE_ARM); r.armOk = false;

  });

  // 手势停下后带一小段惯性，滚轮不带

  const tSpeed = (time.t - prevT) / dt;

  rigs.forEach(r => {
    r.presence = THREE.MathUtils.damp(r.presence, r.want, r.want ? 5 : 4, dt);
    r.spin = r.locked ? tSpeed : 0;
    const appear = 1 - Math.pow(1 - r.presence, 3);

    });

    }

    r.arc.material.opacity = .9 * bright;

    _q.setFromUnitVectors(Y, r.armDir);
    r.rings.forEach((m, i) => {
      const U = m.userData;
      U.angle += (U.spin + r.spin * 3) * dt;
      const along = r.armOk ? r.armLen * (.2 + .3 * i) : r.handLen * (.3 + U.along * .9);
      m.position.copy(r.wrist).addScaledVector(r.armDir, along);
      m.quaternion.copy(_q).multiply(_spinQ.setFromAxisAngle(Y, U.angle));
      const rad = r.handLen * U.rad * (r.armOk ? 1 - i * .08 : 1);
      m.scale.set(rad, r.handLen * 1.2, rad);
      m.material.opacity = bright * THREE.MathUtils.clamp(r.presence * 3 - i * .4, 0, 1) * .9;
    });
    if (r.presence > .5) spawn(r, Math.floor((r.locked ? 2.5 : .8) + Math.abs(r.spin) * 30 * Math.random()));
  });
  stepParticles(dt);
  updateAudio(dt, tSpeed, prevT);
  renderer.render(scene, camera);
  drawDebug();

  document.getElementById('hud').innerHTML =
    `FPS ${fps.toFixed(0)}<br>t ${time.t >= 0 ? '+' : ''}${time.t.toFixed(2)}${stageName(time.t) ? ' ' + stageName(time.t).replace(/</g, '&lt;') : ''}${time.locked ? ' · 锁定' : ''} · 全程 ${LIFE_DEG}°` +

    `<br>手 ${hands.filter(H => H.seen).length} 只` + hands.map((H, k) => H.seen ? ` · ${k ? '左' : '右'}${H.open ? '张' : '握'}${H.armOk ? '·臂' : ''}` : '').join('');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => document.getElementById('tip').style.opacity = 0, 10000);

window.__timespell = () => ({ t: time.t, locked: time.locked, fps, camOk, handStatus, hands: hands.filter(H => H.seen).length, presence: rigs[0].presence,
  audio: audio.on, tracks: audio.tracks, track: audio.track, lifeDeg: LIFE_DEG, arcLen: rigs[0].arc.geometry.parameters.thetaLength, rings: rigs[0].rings.map(m => m.position.toArray().map(v => Math.round(v))) });
